particle_filter:
  ros__parameters:
    # topic names
    scan_topic: '/scan'
    odometry_topic: '/odom'
    # range data downsampling
    angle_step: 18
    max_particles: 8000
    squash_factor: 2.2
    # visualization
    viz: 1
    max_viz_particles: 0
    # ray marching method
    range_method: 'rmgpu'
    theta_discretization: 112
    # range data filtering
    max_range: 10
    fine_timing: 0
    publish_odom: 1
    # sensor model constants
    z_short: 0.01
    z_max: 0.07
    z_rand: 0.12
    z_hit: 0.75
    sigma_hit: 8.0
    # motion model dispersion constants
    motion_dispersion_x: 0.05
    motion_dispersion_y: 0.025
    motion_dispersion_theta: 0.25
    # sensor model variant, variant 2 good for rmgpu, 3 doesn't work for rmgpu
    rangelib_variant: 2
    # ── Bridge / dual-map support ──
    # When over_map_yaml is non-empty, PF pre-loads a SECOND map at startup and
    # swaps to it on /region/active messages from the region_manager node.
    # IMPORTANT: both maps must share the same resolution (e.g. 0.05 m/px).
    #
    # PATH RESOLUTION: a leading '/' makes this an absolute path; otherwise
    # PF resolves it against `<particle_filter install share>/maps/`. The
    # second form is what you want for portability between dev and Jetson:
    #     over_map_yaml: 'ICRA_Masters/over_map.yaml'   # ← preferred
    over_map_yaml: 'under_map_bridged_TOP.yaml'   # bridge / over-route variant
    region_topic: '/region/active'
    # When the two maps differ by only a few pixels (bridge wall patch),
    # leave tighten OFF — it collapses a healthy cloud to its mean and would
    # visibly jitter the pose estimate. The other stddevs only apply when
    # tighten is true (e.g. if you ever swap between very different maps).
    tighten_particles_on_swap: false
    region_swap_xy_stddev: 0.10      # m
    region_swap_theta_stddev: 0.05   # rad

map_server:
  ros__parameters:
    # assuming map file is in particle_filter/maps
    map: 'under_map_bridged_BOTTOM'   # base / under-route variant
